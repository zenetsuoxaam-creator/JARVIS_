name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o *.zip

      - name: Inject Missing Definitions
        working-directory: ./Jarvis
        run: |
          # JarvisInCallService ke liye import
          sed -i '1s/^/import android.telecom.CallAudioState\n/' app/src/main/java/com/jarvis/app/JarvisInCallService.kt

          # Missing keys aur variables ke liye ek config file banana
          mkdir -p app/src/main/java/com/jarvis/app/config
          cat << 'EOF' > app/src/main/java/com/jarvis/app/config/MissingConfig.kt
          package com.jarvis.app.config

          object MissingConfig {
              const val geminiKey = "missing_key_placeholder"
              const val geminiKeys = "missing_keys_placeholder"
              const val isQuotaLimited = false
              const val isValid = true
          }
          EOF

          # Baaki files mein missing references ko is config se link karna
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/geminiKey/com.jarvis.app.config.MissingConfig.geminiKey/g' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/geminiKeys/com.jarvis.app.config.MissingConfig.geminiKeys/g' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/isQuotaLimited/com.jarvis.app.config.MissingConfig.isQuotaLimited/g' {} +
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/isValid/com.jarvis.app.config.MissingConfig.isValid/g' {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build Debug APK
        working-directory: ./Jarvis
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
