name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o *.zip

      - name: Fix Imports and Dependencies
        working-directory: ./Jarvis
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path

          # 1. JarvisInCallService.kt mein CallAudioState import ensure karna
          incall = Path("app/src/main/java/com/jarvis/app/JarvisInCallService.kt")
          if incall.exists():
              text = incall.read_text(encoding="utf-8")
              if "import android.telecom.CallAudioState" not in text:
                  if "package " in text:
                      lines = text.splitlines()
                      out = []
                      added = False
                      for line in lines:
                          out.append(line)
                          if not added and line.startswith("package "):
                              out.append("import android.telecom.CallAudioState")
                              added = True
                      incall.write_text("\n".join(out) + "\n", encoding="utf-8")
                  else:
                      incall.write_text("import android.telecom.CallAudioState\n" + text, encoding="utf-8")

          # 2. app/build.gradle.kts mein security-crypto dependency ensure karna
          gradle_file = Path("app/build.gradle.kts")
          if gradle_file.exists():
              g_text = gradle_file.read_text(encoding="utf-8")
              if "androidx.security:security-crypto" not in g_text:
                  dep_line = '    implementation("androidx.security:security-crypto:1.1.0-alpha06")'
                  if "dependencies {" in g_text:
                      g_text = g_text.replace("dependencies {", f"dependencies {{\n{dep_line}", 1)
                  else:
                      g_text += f"\n\ndependencies {{\n{dep_line}\n}}\n"
                  gradle_file.write_text(g_text, encoding="utf-8")
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build Debug APK
        working-directory: ./Jarvis
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: Jarvis/app/build/outputs/apk/debug/*.apk
